# Gemini infographic prompt — deliberately short and close to how a person
# would brief this by hand. The post's own text is included verbatim and the
# model decides what to surface; earlier versions pre-chopped it into ~20
# structured slots (archetype, hierarchy, density, motifs, coverage...) which
# forced cluttered layouts and rendered truncated sentence fragments.

role: |
  I am creating a LinkedIn post for {brand_name}, an IT support and
  cybersecurity company serving regulated UK businesses. This image
  accompanies the post below and is meant to educate that audience.

post_block: |
  THE POST:

  Hook:
  {hook}

  Body:
  {body}

image_task: |
  Create one polished image that educates the audience about this topic.

  Pull out the single clearest idea — do not try to fit the whole post into
  the image. Prefer one strong focal illustration with generous whitespace
  over many small crowded elements.

  Any text you render must be short, spelled correctly, and taken from the
  post's own wording. Never render a partial, cut-off or mid-sentence
  fragment — if a line will not fit comfortably, use fewer words instead.
  Never invent statistics, percentages, dates or claims that do not appear
  in the post above.

brand_block: |
  BRAND:
  - Name: {brand_name}
  - Primary: {primary_hex}
  - Secondary: {secondary_hex}
  - Accent: {accent_hex}
  - Background: {background_hex}
  {logo_instruction}

format_block: |
  FORMAT: {format_label}, aspect ratio {aspect_ratio}, canvas {width}x{height}.
  Professional cybersecurity consulting aesthetic — crisp vector/infographic
  clarity, high-contrast readable type, no neon glow, no glitch, no comic
  style, nothing touching the frame edge.

negative: |
  misspellings, garbled letters, truncated or cut-off sentences, unreadable text,
  duplicated logos, invented logo, placeholder logo shape, neon cyberpunk glow,
  empty sparse poster, watermark, stock photo collage, low contrast grey-on-grey,
  comic book style, 3D plastic clipart, call-to-action box, button,
  cramped or cluttered layout, elements touching the edge of the frame
