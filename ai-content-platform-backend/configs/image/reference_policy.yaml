# Reference image policy for Gemini infographic generation.

defaults:
  mode: auto
  max_references: 3

modes:
  auto:
    include_logo_when_enabled: true
    include_brand_style: true
    include_previous_creative: false
  brand:
    include_logo_when_enabled: true
    include_brand_style: true
    include_previous_creative: false
  none:
    include_logo_when_enabled: false
    include_brand_style: false
    include_previous_creative: false

roles:
  logo_identity:
    mime_type: image/png
    prompt_hint: "Use this exact brand logo mark for identity fidelity; place once only."
  brand_style:
    mime_type: image/png
    prompt_hint: >-
      STYLE REFERENCE — the next image is an approved house-style example.
      Match its visual language: composition and whitespace, illustration
      treatment, colour handling, type hierarchy and restraint, and overall
      level of detail. Aim for this much visual calm — one clear focal
      illustration, generous breathing room, no crowding. Do NOT copy any of
      its text, headline, statistics, icons or subject matter; all wording and
      content must come from the CONTENT section of the prompt. Do not copy or
      render the logo, wordmark or company name visible in this reference; the
      application adds the exact supplied logo after generation. Reproduce the
      style only, never the substance.
  previous_creative:
    mime_type: image/png
    prompt_hint: "Keep visual continuity with this previous creative without copying layout verbatim."

logo_correction:
  # The Gemini workflow always stamps the supplied logo after generation.
  # These values control its placement and sizing.
  stamp_when_critic_flags: true
  never_duplicate: true
  default_stamp_position: bottom_right
  default_stamp_scale: 0.11
