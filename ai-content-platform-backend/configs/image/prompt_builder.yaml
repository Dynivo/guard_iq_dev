# Positive prompt — validated "alert card" / "stat diagram" templates
# (see docs/PROMPT_VALIDATION.md). Each variant of a draft cycles through
# style_order by variant_index, always via the same provider (see workflow.py) —
# visual variety comes from style, not from mixing AI models.
# Each fact appears exactly once per template; real headline/subtext/callout copy
# is quoted for exact rendering, never abstracted into 2-4 word node labels.

style_order:
  - alert_card
  - stat_diagram_card

templates:
  alert_card: >-
    Design a single square (1:1) LinkedIn graphic for {brand_name}, a {brand_personality}.
    This is a premium dark-navy educational alert card: authoritative, useful, and visually
    polished. The content and typography remain the focus; do not turn it into an illustration-led
    poster, animated explainer, technical dashboard, or futuristic concept image. Use a deep
    tonal navy background ({primary_color}), restrained editorial depth, generous 56–64px margins,
    a very faint oversized window-pane geometry, extremely subtle grid lines, delicate grain,
    and one thin accent-colour ({accent_color}) diagonal line at the top-right corner.


    OFFICIAL LOGO HEADER (top centre, about 9% of image height): an exact official logo image
    is attached to this request. Use that attached logo exactly once, preserving its lettering,
    proportions, stars, shield, colours, and wordmark. Do not redraw, simplify, restyle, recolour,
    place it inside an invented badge, or add another company name. Give it generous clear space.
    Place a thin horizontal accent-colour divider beneath it.


    CATEGORY LABEL (small uppercase, accent colour, expanded letter spacing, left aligned):
    render this exact text with perfect spelling: "{eyebrow}"


    HEADLINE (large bold white modern sans-serif, left aligned): render this exact text with
    perfect spelling: "{headline}". Balance it across no more than 3 comfortable lines; maintain
    strong mobile readability and do not crowd the margins or let it dominate the whole canvas.


    SUPPORTING EXPLANATION (smaller pale blue-white, left aligned below the headline): render this
    exact text with perfect spelling: "{subtext}". Keep it clearly readable as educational context,
    using no more than 2 balanced lines. Header plus copy should use roughly the upper 62% of the canvas.


    EDUCATIONAL STRIP (lower section): add a thin divider and the exact small uppercase heading
    "{education_heading}". Below it create exactly 3 equal, compact, subtly translucent navy panels
    in one horizontal sequence. Render one grounded 2–4 word label per panel, in this exact order,
    using the semicolon-separated list: {short_labels}. Do not paraphrase, duplicate, truncate, or
    invent labels. Give every panel one small consistent flat-line icon suited to its label, equal
    visual weight, and generous spacing. Connect the panels with one thin accent-colour line and
    restrained arrowheads; introduce one small amber warning accent only at the final transition.
    The sequence must teach the reader the progression at a glance while remaining readable on mobile.


    Do not add a footer, service list, second wordmark, CTA box, button, paragraph, or any other text.


    Overall composition must match a premium B2B SaaS security-brand aesthetic (think
    Cloudflare, CrowdStrike, Vanta marketing graphics) — clean editorial information design,
    strong hierarchy, generous negative space, crisp flat-line icons, subtle depth rather than a
    large illustration, no people, no hackers, no generic padlock, no stock photography, no SIM
    card, no computer chip, no circular security rings, no radar/HUD, no neon cyberpunk glow,
    no glossy 3D icons, and nothing touching the frame edge.{variant_note}

  stat_diagram_card: >-
    Design a single square (1:1) LinkedIn graphic for {brand_name}, a {brand_personality}.
    Light off-white background ({surface_color}), premium flat corporate style, generous
    margins, no clutter, one consistent flat-line icon style throughout (no mixed icon
    styles, no gradients, no glossy 3D icons).


    TITLE (top, large, bold, dark navy {primary_color}, centered, render this exact text
    with perfect spelling, max 2 lines): "{headline}"


    Below the title, a thin horizontal accent-colour ({accent_color}) divider line.


    STAT CALLOUT (left side, appears exactly once in the whole image — do not repeat this
    number or its caption anywhere else): a large bold dark navy numeral reading exactly
    "{stat_number}", with a small upward accent-colour trend arrow beside it, and one short
    caption line below the number, render exactly: "{stat_caption}"


    ICON ROW (right side, exactly 3 simple flat-line icon circles in one consistent style,
    connected by thin straight accent-colour lines, evenly spaced, generous whitespace
    between them): each circle has one short 2-3 word label taken directly from this list,
    one label per circle, verbatim, do not invent or paraphrase: {short_labels}.


    Generous empty space below the icon row — no callout line, no call-to-action text,
    no extra text block.


    LOGO (bottom right corner, small, about 8% of image height, always in this exact
    position): {logo_description_on_light}. Small bold dark navy wordmark
    "{brand_name_upper}" beside it.


    Overall composition must match a premium B2B SaaS security-brand aesthetic (think
    Cloudflare, CrowdStrike, Vanta marketing graphics) — clean typographic hierarchy, no
    illustrations of people, no hackers, no photorealistic clip art, no stock photography,
    no duplicate stats or labels anywhere in the image.{variant_note}

default_workflow_id: flux_dev
default_workflow_version: "1"
default_negative: >-
  blurry text, misspelled words, extra logos, watermarks, cluttered layout, neon glow,
  cartoon style, duplicate text, overlapping elements, decorative sparkles, mixed icon
  styles, glossy 3d icons, bordered CTA panel, unrequested button or badge, company-name
  footer, service-list footer, second wordmark, SIM card, computer chip, circular security
  rings, radar interface, sci-fi HUD, giant illustration, giant headline
logo_description_on_dark: >-
  a simple white outline shield icon with a checkmark inside it, with three small
  five-pointed gold/yellow stars arranged above the shield
logo_description_on_light: >-
  a simple dark navy outline shield icon with a checkmark inside it, with three small
  five-pointed gold/yellow stars arranged above the shield
surface_color: "#F4F7F5"
style_prefix: premium flat branded LinkedIn alert-card graphic
avoid_prefix: "Strictly avoid"
