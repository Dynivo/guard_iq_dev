# AI Judge configuration — anonymous ranking after deterministic scores
capability: consensus_judge
anonymize: true
temperature: 0.2
max_tokens: 2048
response_format: json
prompt_id: consensus_judge
min_candidates: 1
schema:
  required:
    - rankings
    - confidence
  rankings_item:
    - candidate_id
    - rank
    - strengths
    - weaknesses
    - linkedin_quality
    - audience_fit
    - confidence
