name: Mac installation smoke

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Mac architecture to test
        required: true
        default: macos-15
        type: choice
        options:
          - macos-15
          - macos-15-intel

permissions:
  contents: read

jobs:
  install-and-smoke:
    name: Clean install (${{ inputs.runner }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    env:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://content_app:ci-local-only-password@127.0.0.1:5432/ai_content_platform
      JWT_SECRET_KEY: ci-access-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      JWT_REFRESH_SECRET_KEY: ci-refresh-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      SEED_ADMIN_PASSWORD: ci-local-admin-password-123
      CORS_ORIGINS: '["http://127.0.0.1:3000"]'
      VITE_API_BASE_URL: http://127.0.0.1:8000/api/v1
      GEMINI_API_KEY: ''
      OPENAI_API_KEY: ''

    steps:
      - name: Check out delivery
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-content-platform-backend/requirements*.txt

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ai-content-platform-frontend/package-lock.json

      - name: Start PostgreSQL 16
        shell: bash
        run: |
          set -euo pipefail
          brew install postgresql@16
          brew services start postgresql@16
          PG_BIN="$(brew --prefix postgresql@16)/bin"
          echo "$PG_BIN" >> "$GITHUB_PATH"
          for _ in $(seq 1 30); do
            if "$PG_BIN/pg_isready" -d postgres >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          "$PG_BIN/pg_isready" -d postgres
          if ! "$PG_BIN/psql" postgres -tAc "SELECT 1 FROM pg_roles WHERE rolname='content_app'" | grep -q 1; then
            "$PG_BIN/psql" postgres -c "CREATE ROLE content_app LOGIN PASSWORD 'ci-local-only-password'"
          fi
          if ! "$PG_BIN/psql" postgres -tAc "SELECT 1 FROM pg_database WHERE datname='ai_content_platform'" | grep -q 1; then
            "$PG_BIN/createdb" --owner=content_app ai_content_platform
          fi

      - name: Install and prepare backend
        working-directory: ai-content-platform-backend
        shell: bash
        run: |
          set -euo pipefail
          python3.12 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r requirements-dev.txt
          .venv/bin/alembic upgrade head
          .venv/bin/python scripts/seed_database.py

      - name: Run backend tests
        working-directory: ai-content-platform-backend
        shell: bash
        env:
          APP_ENV: test
        run: .venv/bin/pytest -q

      - name: Verify local backup archive
        working-directory: ai-content-platform-backend
        shell: bash
        run: |
          set -euo pipefail
          BACKUP_DIR="$RUNNER_TEMP/guardiq-backups"
          RESTORE_CHECK="$RUNNER_TEMP/guardiq-restore-check"
          .venv/bin/python scripts/backup_local.py --output-dir "$BACKUP_DIR"
          BACKUP_FILE="$(find "$BACKUP_DIR" -maxdepth 1 -name 'guardiq-backup-*.zip' -print -quit)"
          test -n "$BACKUP_FILE"
          mkdir -p "$RESTORE_CHECK"
          unzip -q "$BACKUP_FILE" -d "$RESTORE_CHECK"
          pg_restore --list "$RESTORE_CHECK/database.dump" >/dev/null

      - name: Install and build frontend
        working-directory: ai-content-platform-frontend
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Start both services and verify local endpoints
        shell: bash
        run: |
          set -euo pipefail
          BACKEND_LOG="$RUNNER_TEMP/guardiq-backend.log"
          FRONTEND_LOG="$RUNNER_TEMP/guardiq-frontend.log"
          (cd ai-content-platform-backend && .venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000 >"$BACKEND_LOG" 2>&1) &
          BACKEND_PID=$!
          (cd ai-content-platform-frontend && npm run preview -- --host 127.0.0.1 --port 3000 >"$FRONTEND_LOG" 2>&1) &
          FRONTEND_PID=$!
          cleanup() {
            kill "$BACKEND_PID" "$FRONTEND_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          READY=0
          for _ in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:8000/api/v1/health >/dev/null \
              && curl --silent --fail http://127.0.0.1:3000 >/dev/null; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo "Backend log:"
            tail -100 "$BACKEND_LOG" || true
            echo "Frontend log:"
            tail -100 "$FRONTEND_LOG" || true
            exit 1
          fi
          curl --fail http://127.0.0.1:8000/api/v1/health
          curl --fail http://127.0.0.1:3000 >/dev/null
